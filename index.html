<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input[type="text"], input[type="email"] {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
        }
        .custom-file-upload {
            border: 2px dashed #007bff; display: block; padding: 20px;
            cursor: pointer; border-radius: 6px; text-align: center;
            background: #f8fbff; margin-bottom: 10px; transition: 0.2s;
        }
        .custom-file-upload:hover { background: #eef5ff; }
        #preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        #preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        button {
            width: 100%; padding: 14px; background-color: #007bff; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #0056b3; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Complete Your KYC</h2>
    <form id="kycForm">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="Jane Doe">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="jane@example.com">
        <label>Telegram Username (Optional)</label>
        <input type="text" id="username" placeholder="@janedoe">

        <label>Upload 5 Photos *</label>
        <label class="custom-file-upload">
            <input type="file" id="photos" multiple accept="image/*" required hidden>
            <span id="fileLabel">📸 Click to Choose 5 Photos</span>
        </label>
        <div id="preview"></div>
        <small style="color:#888; display:block; margin-bottom:15px;">Max 5 images, 10MB each</small>

        <button type="submit" id="submitBtn">Submit for Review</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const photosInput = document.getElementById('photos');
    const preview = document.getElementById('preview');
    const fileLabel = document.getElementById('fileLabel');
    const RENDER_URL = 'https://kyc-bot-rd59.onrender.com/webhook/kyc-submit';

    photosInput.addEventListener('change', function() {
        preview.innerHTML = '';
        if (this.files.length > 5) {
            alert('Please select max 5 photos');
            this.value = '';
            return;
        }
        fileLabel.textContent = `${this.files.length} photos selected`;
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    document.getElementById('kycForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        if (photosInput.files.length === 0) {
            status.textContent = "❌ Please select photos";
            status.className = "error";
            return;
        }

        btn.disabled = true;
        btn.textContent = "Uploading... Please wait";
        status.textContent = "Sending to admin...";
        status.className = "";

        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('username', document.getElementById('username').value);
        for (let file of photosInput.files) {
            formData.append('photos', file);
        }

        try {
            const response = await fetch(RENDER_URL, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            
            if (response.ok && result.success) {
                status.textContent = "✅ Submitted successfully! Admin will review your photos on Telegram.";
                status.className = "success";
                btn.textContent = "✅ Submitted";
                document.getElementById('kycForm').reset();
                preview.innerHTML = '';
                fileLabel.textContent = "📸 Click to Choose 5 Photos";
            } else {
                throw new Error(result.error || 'Failed');
            }
        } catch (error) {
            console.error(error);
            status.textContent = "❌ Submission failed. Bot might be sleeping - try again in 30 sec.";
            status.className = "error";
            btn.disabled = false;
            btn.textContent = "Try Again";
        }
    });
</script>

</body>
    </html>
