<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .photo-upload {
            margin-bottom: 15px;
        }
        input[type="file"] {
            display: none; /* Hide default ugly file inputs /
        }
        .custom-file-upload {
            border: 1px dashed #ccc;
            display: inline-block;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 6px;
            width: 100%;
            text-align: center;
            background: #fafafa;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Complete Your KYC</h2>
    <form id="kycForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Jane Doe">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="jane@example.com">

        <label for="username">Telegram Username (Optional)</label>
        <input type="text" id="username" name="username" placeholder="@janedoe">

        <div class="photo-upload">
            <label for="photos">Upload 5 Photos</label>
            <!-- Note: In a real app, you'd upload these to a server first and send URLs here -->
            <label class="custom-file-upload">
                <input type="file" id="photos" name="photos" multiple accept="image/" required>
                📸 Choose Files
            </label>
            <small style="display:block; margin-top:5px; color:#888;">Select up to 5 images.</small>
        </div>

        <button type="submit" id="submitBtn">Submit for Review</button>
    </form>
    <div id="status"></div>
</div>

<script>
    document.getElementById('kycForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.textContent = "Uploading...";
        status.textContent = "";
        status.style.color = "#555";

        // Get values
        const name = document.getElementById('name').value;

const email = document.getElementById('email').value;
        const username = document.getElementById('username').value;
        const photosInput = document.getElementById('photos');

        // --- IMPORTANT: PHOTO HANDLING ---
        // Since this is a simple frontend, we will just send the 
        // file names/paths if they are already hosted, or in a real scenario,
        // you would upload them to AWS S3/Firebase first and get URLs.
        // For this demo, we assume the user has direct URLs or we send the files as FormData.
        
        const formData = new FormData();
        formData.append('name', name);
        formData.append('email', email);
        formData.append('username', username);
        
        // If you have a backend that handles file uploads, use FormData.
        // If you want to keep it simple with JSON, you need the URLs of the images.
        // Here, we'll send the File objects if your backend supports multipart/form-data.
        for (let i = 0; i < photosInput.files.length; i++) {
            formData.append('photos', photosInput.files[i]);
        }

        try {
            // Replace with your actual Render URL
            const response = await fetch('https://YOUR_RENDER_URL/webhook/kyc-submit', {
                method: 'POST',
                body: formData // Use FormData for file uploads
            });

            if (response.ok) {
                status.textContent = "✅ Submitted successfully! Waiting for admin approval.";
                status.style.color = "green";
                btn.textContent = "Submitted";
            } else {
                throw new Error("Server error");
            }
        } catch (error) {
            status.textContent = "❌ Submission failed. Please try again.";
            status.style.color = "red";
            btn.disabled = false;
            btn.textContent = "Try Again";
        }
    });
</script>

</body>
  </html>
